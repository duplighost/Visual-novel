<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STATIC — A Killing Game</title>
  <meta name="description" content="STATIC is a Danganronpa-style visual novel killing game: twenty Ultimates, twenty wounds, one machine where the dating sim and the killing game are the same act aimed in opposite directions." />
  <meta name="theme-color" content="#0b0a0c" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

  <!-- Open Graph / social sharing. If links don't preview, replace the two
       commented absolute URLs below with your live domain. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="STATIC" />
  <meta property="og:title" content="STATIC — A Killing Game" />
  <meta property="og:description" content="Twenty Ultimates. Twenty wounds. One machine. A Danganronpa-style visual novel: solve the murders, romance the broken, and find out who's been holding the pen." />
  <meta property="og:image" content="assets/og-image.jpg" />
  <!-- <meta property="og:url" content="https://YOUR-SITE.netlify.app/" /> -->
  <!-- <meta property="og:image" content="https://YOUR-SITE.netlify.app/assets/og-image.jpg" /> -->
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="STATIC — A Killing Game" />
  <meta name="twitter:description" content="Twenty Ultimates. Twenty wounds. One machine." />
  <meta name="twitter:image" content="assets/og-image.jpg" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game">
    <!-- animated background layer -->
    <div id="bg" class="bg bg-dark"></div>
    <div id="scanlines"></div>

    <!-- TITLE SCREEN -->
    <div id="title">
      <div id="montage" class="montage"></div>
      <div class="title-vignette"></div>
      <div class="title-inner">
        <div class="title-logo">
          <span class="logo-static">STATIC</span>
          <span class="logo-rec">● REC</span>
        </div>
        <div class="title-sub">A KILLING GAME</div>
        <div class="title-tag">Twenty Ultimates. Twenty wounds. One machine.</div>
        <div class="title-menu">
          <button class="big-btn" id="newBtn">▶ New Broadcast</button>
          <button class="big-btn" id="continueBtn">⟳ Continue</button>
          <button class="big-btn" id="loadBtn">📂 Load Game</button>
          <button class="big-btn" id="galleryTitleBtn">📁 Cast Gallery</button>
          <button class="big-btn" id="setTitleBtn">⚙ Settings</button>
        </div>
        <div class="title-foot">Click or press Space / Enter to advance dialogue.</div>
      </div>
    </div>

    <!-- VN STAGE -->
    <div id="stage" style="display:none">
      <div id="sprite" class="sprite"></div>
      <div id="dialogue" class="dialogue">
        <div id="nametag" class="nametag"></div>
        <div id="text" class="text"></div>
        <div id="advance" class="advance">▼</div>
        <div id="choices" class="choices"></div>
      </div>
    </div>

    <!-- FULLSCREEN OVERLAYS (investigation, trial, hub, gallery) -->
    <div id="overlay" class="overlay" style="display:none"></div>
  </div>

  <button id="muteBtn" class="mute-btn" title="Toggle sound">♪</button>
  <script src="js/audio.js"></script>
  <script src="data/characters.js"></script>
  <script src="js/portraits.js"></script>
  <script src="js/story.js"></script>
  <script src="js/casedata.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
