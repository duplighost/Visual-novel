<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Dead Air · STATIC</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .nf{ position:relative; z-index:30; text-align:center; padding:40px; max-width:640px; }
    .nf-code{ font-family:var(--serif); font-size:clamp(80px,20vw,180px); font-weight:700; line-height:.9;
      background:linear-gradient(180deg,#f6e6b8,#c9a24a 60%,#8a6a26);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
      text-shadow:0 0 30px rgba(216,176,86,.3); }
    .nf-rec{ color:var(--pink); letter-spacing:.3em; font-weight:bold; }
    .nf-title{ font-family:var(--serif); font-size:clamp(22px,5vw,38px); letter-spacing:.2em; color:var(--gold); margin:6px 0 14px; }
    .nf-text{ color:var(--steel); font-style:italic; line-height:1.6; margin-bottom:28px; }
  </style>
</head>
<body>
  <div class="bg bg-dark"></div>
  <div id="scanlines"></div>
  <div class="nf">
    <div class="nf-rec">● OFF AIR</div>
    <div class="nf-code">404</div>
    <div class="nf-title">DEAD AIR</div>
    <p class="nf-text">This page was never on the broadcast — or it's already been cancelled.<br>
      The only thing STATIC can't forgive is dead air. Let's get you back on the show.</p>
    <a class="big-btn" href="/">▶ Return to the Studio</a>
  </div>
</body>
</html>
